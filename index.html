<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eFactory予約</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin-top: 0;
    }

    h2 {
      font-size: 18px;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    p {
      line-height: 1.6;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      background: #eef7f4;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-all;
    }

    .error {
      background: #fff0f0;
      color: #b00020;
    }

    .warning {
      background: #fff8e5;
      color: #5a3b00;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #00b900;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button.secondary {
      background: #444;
    }

    button.danger {
      background: #b00020;
    }

    button.slot {
      background: #fff;
      color: #222;
      border: 1px solid #00b900;
      margin-top: 8px;
      text-align: left;
    }

    button.slot.selected {
      background: #00b900;
      color: #fff;
    }

    .vehicle-card, .date-card {
      padding: 12px;
      background: #f3f6f6;
      border-radius: 8px;
      margin-top: 10px;
      line-height: 1.7;
    }

    .admin-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #222;
      color: #fff;
      font-size: 12px;
    }

    .small {
      font-size: 12px;
      color: #666;
    }

    pre {
      white-space: pre-wrap;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>eFactory予約</h1>
    <p>LINEアカウントと予約情報を連携します。</p>

    <div id="app" class="status">
      起動中です...
    </div>
  </div>

  <script>
    const LIFF_ID = '2010526723-NFUasgWN';
    const API_URL = 'https://script.google.com/macros/s/AKfycbzwogK43RNJA29ujZsdadNXDHFuDk4envDHyQxyTNY5KhcyfyHGTTdybUV-jipnIxxBVA/exec';

    const app = document.getElementById('app');

    let lineProfile = null;
    let currentCustomer = null;
    let currentVehicles = [];
    let currentMenus = [];
    let currentAvailableStarts = [];
    let currentAllowedSlotCounts = [];
    let currentIsAdmin = false;

    let selectedVehicleId = '';
    let selectedMenuId = '';
    let selectedSlotCount = 1;
    let selectedStartSlotId = '';

    async function main() {
      try {
        app.className = 'status';
        app.innerHTML = 'LIFF SDKを確認中...';

        if (typeof liff === 'undefined') {
          throw new Error('LIFF SDKが読み込めていません。');
        }

        app.innerHTML = 'LIFFを初期化しています...';

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          app.innerHTML = 'LINEログインへ移動します...';
          liff.login();
          return;
        }

        app.innerHTML = 'LINEプロフィールを取得しています...';

        lineProfile = await liff.getProfile();

        app.innerHTML = '予約DBと同期しています...';

        const response = await jsonp(API_URL, {
          action: 'syncCustomer',
          lineUserId: lineProfile.userId,
          lineDisplayName: lineProfile.displayName
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        currentCustomer = response.customer;
        currentVehicles = response.vehicles || [];
        currentIsAdmin = !!response.isAdmin;

        if (needsInitialRegistration(currentCustomer, currentVehicles)) {
          renderInitialForm();
        } else {
          renderHome();
        }

      } catch (error) {
        renderError(error);
      }
    }

    function needsInitialRegistration(customer, vehicles) {
      if (!customer) return true;
      if (customer.status === '仮登録') return true;
      if (!customer.name) return true;
      if (!vehicles || vehicles.length === 0) return true;
      return false;
    }

    function renderInitialForm() {
      app.className = 'status warning';
      app.innerHTML = `
        <strong>初回登録</strong><br>
        初回のみ、お客様情報と車両情報を登録してください。<br>
        次回以降は入力を省略できます。

        <h2>お客様情報</h2>

        <label>氏名 必須</label>
        <input id="name" type="text" placeholder="例：山田 太郎" value="${escapeAttr(currentCustomer.name || '')}">

        <label>LINE名</label>
        <input id="lineName" type="text" placeholder="LINE上の表示名など" value="${escapeAttr(currentCustomer.line_name || lineProfile.displayName || '')}">

        <label>電話番号</label>
        <input id="phone" type="tel" placeholder="例：090-0000-0000" value="${escapeAttr(currentCustomer.phone || '')}">

        <label>メールアドレス</label>
        <input id="email" type="email" placeholder="例：example@example.com" value="${escapeAttr(currentCustomer.email || '')}">

        <h2>車両情報</h2>

        <label>メーカー</label>
        <input id="maker" type="text" placeholder="例：スズキ、ホンダ、ヤマハ">

        <label>車種 必須</label>
        <input id="model" type="text" placeholder="例：GSX-S1000、GROM、MT-09">

        <label>年式</label>
        <input id="year" type="text" placeholder="例：2020">

        <label>型式</label>
        <input id="typeCode" type="text" placeholder="例：2BL-GT79B">

        <label>車両メモ</label>
        <textarea id="vehicleNote" placeholder="改造内容、気になる症状、用途など"></textarea>

        <button onclick="saveInitialProfile()">登録する</button>
      `;
    }

    async function saveInitialProfile() {
      try {
        const name = getValue('name');
        const lineName = getValue('lineName');
        const phone = getValue('phone');
        const email = getValue('email');

        const maker = getValue('maker');
        const model = getValue('model');
        const year = getValue('year');
        const typeCode = getValue('typeCode');
        const vehicleNote = getValue('vehicleNote');

        if (!name) {
          alert('氏名を入力してください。');
          return;
        }

        if (!model) {
          alert('車種を入力してください。');
          return;
        }

        app.className = 'status';
        app.innerHTML = '登録しています...';

        const response = await jsonp(API_URL, {
          action: 'saveInitialProfile',
          lineUserId: lineProfile.userId,
          name,
          lineName,
          phone,
          email,
          maker,
          model,
          year,
          typeCode,
          vehicleNote
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        currentCustomer = response.customer;
        currentVehicles = response.vehicles || [];
        currentIsAdmin = !!response.isAdmin;

        renderHome();

      } catch (error) {
        renderError(error);
      }
    }

    function renderHome() {
      app.className = 'status';

      const vehiclesHtml = currentVehicles.length
        ? currentVehicles.map(v => `
            <div class="vehicle-card">
              <strong>${escapeHtml(v.vehicle_nickname || v.model || '登録車両')}</strong><br>
              メーカー：${escapeHtml(v.maker || '')}<br>
              車種：${escapeHtml(v.model || '')}<br>
              年式：${escapeHtml(v.year || '')}<br>
              型式：${escapeHtml(v.type_code || '')}
            </div>
          `).join('')
        : '<p>登録車両がありません。</p>';

      const adminHtml = currentIsAdmin
        ? `
          <div class="admin-badge">管理者</div>
          <button class="secondary" onclick="showAdminDashboard()">管理者画面</button>
        `
        : '';

      app.innerHTML = `
        <strong>登録済みです</strong><br>
        ${currentIsAdmin ? '<span class="admin-badge">管理者としてログイン中</span><br>' : ''}
        <br>
        顧客ID：${escapeHtml(currentCustomer.customer_id)}<br>
        氏名：${escapeHtml(currentCustomer.name)}<br>
        LINE表示名：${escapeHtml(currentCustomer.line_display_name)}<br>
        会員種別：${escapeHtml(currentCustomer.member_type || '非会員')}<br>
        状態：${escapeHtml(currentCustomer.status)}<br>

        <h2>登録車両</h2>
        ${vehiclesHtml}

        <button onclick="showBooking()">空き枠を見て仮予約する</button>
        ${adminHtml}
        <button class="secondary" onclick="location.reload()">再読み込み</button>
      `;
    }

    async function showBooking(menuId, slotCount) {
      try {
        app.className = 'status';
        app.innerHTML = '空き枠を取得しています...';

        const response = await jsonp(API_URL, {
          action: 'getBookingData',
          lineUserId: lineProfile.userId,
          menuId: menuId || selectedMenuId || '',
          slotCount: slotCount || selectedSlotCount || ''
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        currentCustomer = response.customer;
        currentVehicles = response.vehicles || [];
        currentMenus = response.menus || [];
        currentAvailableStarts = response.availableStarts || [];
        currentAllowedSlotCounts = response.allowedSlotCounts || [];
        currentIsAdmin = !!response.isAdmin;

        selectedMenuId = response.selectedMenuId || (currentMenus[0] ? currentMenus[0].menu_id : '');
        selectedVehicleId = selectedVehicleId || (currentVehicles[0] ? currentVehicles[0].vehicle_id : '');
        selectedSlotCount = Number(response.selectedSlotCount || selectedSlotCount || 1);
        selectedStartSlotId = '';

        renderBookingForm();

      } catch (error) {
        renderError(error);
      }
    }

    function renderBookingForm() {
      const vehicleOptions = currentVehicles.map(v => `
        <option value="${escapeAttr(v.vehicle_id)}" ${v.vehicle_id === selectedVehicleId ? 'selected' : ''}>
          ${escapeHtml(v.vehicle_nickname || v.model || v.vehicle_id)}
        </option>
      `).join('');

      const menuOptions = currentMenus.map(m => `
        <option value="${escapeAttr(m.menu_id)}" ${m.menu_id === selectedMenuId ? 'selected' : ''}>
          ${escapeHtml(m.menu_name)}
        </option>
      `).join('');

      const slotCountOptions = currentAllowedSlotCounts.map(n => `
        <option value="${escapeAttr(n)}" ${Number(n) === Number(selectedSlotCount) ? 'selected' : ''}>
          ${escapeHtml(n)}枠（${escapeHtml(Number(n) * 90)}分）
        </option>
      `).join('');

      const slotsHtml = renderSlotsHtml(currentAvailableStarts);

      app.className = 'status';
      app.innerHTML = `
        <strong>仮予約申込</strong><br>
        空き枠を選んで仮予約してください。<br>
        作業内容確認後、eFactory側で承認して予約確定となります。

        <label>車両</label>
        <select id="vehicleId" onchange="selectedVehicleId=this.value">
          ${vehicleOptions}
        </select>

        <label>メニュー</label>
        <select id="menuId" onchange="changeMenu(this.value)">
          ${menuOptions}
        </select>

        <label>利用枠数</label>
        <select id="slotCount" onchange="changeSlotCount(this.value)">
          ${slotCountOptions}
        </select>

        <div class="small">
          1枠は90分です。複数枠を選ぶと、同じ日の連続した空き枠だけが表示されます。
        </div>

        <h2>空き枠</h2>
        ${slotsHtml}

        <label>作業内容 必須</label>
        <textarea id="workDetail" placeholder="例：ブレーキフルード交換を一緒にやりたい。持込フルードあり。"></textarea>

        <label>持込部品</label>
        <select id="partsBrought">
          <option value="なし">なし</option>
          <option value="あり">あり</option>
          <option value="未定">未定</option>
        </select>

        <label>補足・要望</label>
        <textarea id="customerMessage" placeholder="不安な点、事前に伝えたいことがあれば入力してください。"></textarea>

        <button onclick="submitReservation()">仮予約する</button>
        <button class="secondary" onclick="renderHome()">戻る</button>
      `;
    }

    function renderSlotsHtml(slots) {
      if (!slots || slots.length === 0) {
        return `
          <div class="date-card">
            現在、この枠数で選択可能な空き枠がありません。
          </div>
        `;
      }

      const groups = {};
      slots.forEach(s => {
        const key = `${s.date}（${s.weekday_jp}）`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(s);
      });

      return Object.keys(groups).slice(0, 14).map(dateLabel => {
        const buttons = groups[dateLabel].map(s => `
          <button class="slot" id="slot-${escapeAttr(s.start_slot_id)}" onclick="selectSlot('${escapeAttr(s.start_slot_id)}')">
            ${escapeHtml(s.start_time)}〜${escapeHtml(s.end_time)}
          </button>
        `).join('');

        return `
          <div class="date-card">
            <strong>${escapeHtml(dateLabel)}</strong>
            ${buttons}
          </div>
        `;
      }).join('');
    }

    function selectSlot(slotId) {
      selectedStartSlotId = slotId;

      document.querySelectorAll('button.slot').forEach(btn => {
        btn.classList.remove('selected');
      });

      const btn = document.getElementById('slot-' + slotId);
      if (btn) btn.classList.add('selected');
    }

    function changeMenu(menuId) {
      selectedMenuId = menuId;
      showBooking(menuId, selectedSlotCount);
    }

    function changeSlotCount(slotCount) {
      selectedSlotCount = Number(slotCount || 1);
      showBooking(selectedMenuId, selectedSlotCount);
    }

    async function submitReservation() {
      try {
        const vehicleId = document.getElementById('vehicleId').value;
        const menuId = document.getElementById('menuId').value;
        const slotCount = document.getElementById('slotCount').value;
        const workDetail = getValue('workDetail');
        const partsBrought = getValue('partsBrought');
        const customerMessage = getValue('customerMessage');

        if (!selectedStartSlotId) {
          alert('空き枠を選択してください。');
          return;
        }

        if (!workDetail) {
          alert('作業内容を入力してください。');
          return;
        }

        app.className = 'status';
        app.innerHTML = '仮予約を登録しています...';

        const response = await jsonp(API_URL, {
          action: 'createReservation',
          lineUserId: lineProfile.userId,
          vehicleId,
          menuId,
          startSlotId: selectedStartSlotId,
          slotCount,
          workDetail,
          partsBrought,
          customerMessage
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        const r = response.reservation;

        app.className = 'status';
        app.innerHTML = `
          <strong>仮予約を受け付けました</strong><br><br>
          予約ID：${escapeHtml(r.reservation_id)}<br>
          日時：${escapeHtml(r.date)} ${escapeHtml(r.start_time)}〜${escapeHtml(r.end_time)}<br>
          利用枠数：${escapeHtml(r.slot_count)}枠（${escapeHtml(r.duration_min)}分）<br>
          状態：${escapeHtml(r.status)}<br><br>
          この時点ではまだ予約確定ではありません。<br>
          作業内容・車両状態・持込部品を確認後、eFactory側で承認して予約確定となります。<br><br>
          LINEにも仮予約申請中のメッセージを送信しました。

          <button onclick="showBooking()">別の仮予約をする</button>
          <button class="secondary" onclick="renderHome()">ホームに戻る</button>
        `;

      } catch (error) {
        renderError(error);
      }
    }

    async function showAdminDashboard() {
      if (!currentIsAdmin) {
        renderError(new Error('管理者権限がありません。'));
        return;
      }

      try {
        app.className = 'status';
        app.innerHTML = '管理者情報を取得しています...';

        const response = await jsonp(API_URL, {
          action: 'getAdminDashboard',
          lineUserId: lineProfile.userId
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        renderAdminDashboard(response.pending || []);

      } catch (error) {
        renderError(error);
      }
    }

    function renderAdminDashboard(pending) {
      app.className = 'status';

      const pendingHtml = pending.length
        ? pending.map(r => `
            <div class="date-card">
              <strong>${escapeHtml(r.date)}（${escapeHtml(r.weekday_jp)}） ${escapeHtml(r.start_time)}〜${escapeHtml(r.end_time)}</strong><br>
              予約ID：${escapeHtml(r.reservation_id)}<br>
              お客様：${escapeHtml(r.customer_name)} 様<br>
              会員種別：${escapeHtml(r.member_type)}<br>
              車両：${escapeHtml(r.vehicle_name)}<br>
              メニュー：${escapeHtml(r.menu_name)}<br>
              利用枠数：${escapeHtml(r.slot_count)}枠（${escapeHtml(r.duration_min)}分）<br>
              確定ルール：${escapeHtml(formatPolicy(r.confirmation_policy))}<br>
              作業内容：${escapeHtml(r.work_detail)}<br>
              持込部品：${escapeHtml(r.parts_brought)}<br>
              補足：${escapeHtml(r.customer_message)}<br>

              <button onclick="approveReservation('${escapeAttr(r.reservation_id)}', 'close')">承認してこの枠を締め切る</button>
              <button class="secondary" onclick="approveReservation('${escapeAttr(r.reservation_id)}', 'keep_open')">承認して追加受付可能にする</button>
              <button class="danger" onclick="rejectReservation('${escapeAttr(r.reservation_id)}')">却下して枠を戻す</button>
            </div>
          `).join('')
        : '<div class="date-card">承認待ちの仮予約はありません。</div>';

      app.innerHTML = `
        <strong>管理者画面</strong><br>
        承認待ちの仮予約一覧です。

        <h2>承認待ち</h2>
        ${pendingHtml}

        <button class="secondary" onclick="renderHome()">ホームに戻る</button>
      `;
    }

    async function approveReservation(reservationId, slotHandling) {
      const label = slotHandling === 'keep_open'
        ? 'この予約を承認し、この時間帯を追加受付可能にしますか？'
        : 'この予約を承認し、この時間帯を締め切りますか？';

      if (!confirm(label)) {
        return;
      }

      try {
        app.className = 'status';
        app.innerHTML = '承認処理中です...';

        const response = await jsonp(API_URL, {
          action: 'approveReservation',
          lineUserId: lineProfile.userId,
          reservationId,
          slotHandling
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        const slotHandlingLabel = response.slot_handling === 'keep_open'
          ? '追加受付可能'
          : '締め切り';

        app.className = 'status';
        app.innerHTML = `
          <strong>承認しました</strong><br><br>
          予約ID：${escapeHtml(response.reservation_id)}<br>
          状態：${escapeHtml(response.status)}<br>
          枠の扱い：${escapeHtml(slotHandlingLabel)}<br>
          Googleカレンダー登録：完了<br>
          開始：${escapeHtml(response.start)}<br>
          終了：${escapeHtml(response.end)}<br><br>
          ${response.status === '確定'
            ? 'プレミアム会員のため、予約確定LINE通知を送信しました。'
            : '6日前確定対象のため、承認時点ではLINE通知は送信していません。'
          }

          <button onclick="showAdminDashboard()">承認待ち一覧に戻る</button>
          <button class="secondary" onclick="renderHome()">ホームに戻る</button>
        `;

      } catch (error) {
        renderError(error);
      }
    }

    async function rejectReservation(reservationId) {
      const reason = prompt('却下理由やメモを入力してください。空欄でも可。', '');

      if (reason === null) {
        return;
      }

      try {
        app.className = 'status';
        app.innerHTML = '却下処理中です...';

        const response = await jsonp(API_URL, {
          action: 'rejectReservation',
          lineUserId: lineProfile.userId,
          reservationId,
          reason
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        app.className = 'status';
        app.innerHTML = `
          <strong>却下しました</strong><br><br>
          予約ID：${escapeHtml(response.reservation_id)}<br>
          状態：${escapeHtml(response.status)}<br>
          該当枠は空き枠に戻しました。<br>
          お客様にLINEで却下通知を送信しました。<br><br>

          <button onclick="showAdminDashboard()">承認待ち一覧に戻る</button>
          <button class="secondary" onclick="renderHome()">ホームに戻る</button>
        `;

      } catch (error) {
        renderError(error);
      }
    }

    function formatPolicy(policy) {
      if (policy === 'immediate') return '承認後すぐ確定';
      if (policy === 'six_days') return '6日前確定';
      return policy || '';
    }

    function getValue(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function jsonp(url, params) {
      return new Promise((resolve, reject) => {
        const callbackName =
          'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

        params.callback = callbackName;

        const query = Object.keys(params)
          .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
          .join('&');

        const script = document.createElement('script');
        script.src = url + '?' + query;

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('Apps Script APIの呼び出しに失敗しました。'));
        };

        function cleanup() {
          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        setTimeout(() => {
          cleanup();
          reject(new Error('Apps Script APIの応答がタイムアウトしました。'));
        }, 60000);

        document.body.appendChild(script);
      });
    }

    function renderError(error) {
      app.className = 'status error';
      app.innerHTML = `
        <strong>エラー</strong>
        <pre>${escapeHtml(String(error))}
URL: ${escapeHtml(location.href)}
UA: ${escapeHtml(navigator.userAgent)}</pre>
        <button onclick="location.reload()">再読み込み</button>
      `;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(str) {
      return escapeHtml(str).replaceAll('`', '&#096;');
    }

    main();
  </script>
</body>
</html>
