<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eFactory予約</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin-top: 0;
    }

    h2 {
      font-size: 18px;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    p {
      line-height: 1.6;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      background: #eef7f4;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-all;
    }

    .error {
      background: #fff0f0;
      color: #b00020;
    }

    .warning {
      background: #fff8e5;
      color: #5a3b00;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #00b900;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button.secondary {
      background: #444;
    }

    button.danger {
      background: #b00020;
    }

    button.slot {
      background: #fff;
      color: #222;
      border: 1px solid #00b900;
      margin-top: 8px;
      text-align: left;
    }

    button.slot.selected {
      background: #00b900;
      color: #fff;
    }

    button.slot.disabled {
      background: #eee;
      color: #aaa;
      border: 1px solid #ddd;
    }

    .vehicle-card, .date-card {
      padding: 12px;
      background: #f3f6f6;
      border-radius: 8px;
      margin-top: 10px;
      line-height: 1.7;
    }

    .admin-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #222;
      color: #fff;
      font-size: 12px;
    }

    .selected-box {
      margin-top: 14px;
      padding: 12px;
      background: #e8f7e8;
      border-radius: 8px;
      line-height: 1.7;
    }

    .small {
      font-size: 12px;
      color: #666;
    }

    .calendar-toolbar { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
    .calendar-toolbar button { width: auto; margin-top: 0; padding: 9px 12px; }
    .calendar-title { flex: 1; text-align: center; font-weight: 700; }
    .business-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .calendar-day { min-height: 64px; margin-top: 0; padding: 8px 2px; background: #fff; color: #222; border: 1px solid #ddd; border-radius: 7px; }
    .calendar-day .day-number { display: block; font-size: 12px; }
    .calendar-day .day-symbol { display: block; margin-top: 4px; font-size: 22px; }
    .calendar-day.status-P { background: #fff7d6; color: #6a4b00; }
    .calendar-day.status-休 { background: #eee; color: #666; }
    .calendar-day.status-× { background: #fafafa; color: #888; }
    .calendar-day:disabled { opacity: 1; }
    .calendar-legend { margin: 8px 0; font-size: 12px; color: #555; }

    pre {
      white-space: pre-wrap;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>eFactory予約</h1>
    <p>LINEアカウントと予約情報を連携します。</p>

    <div id="app" class="status">
      起動中です...
    </div>
  </div>

  <script>
    const LIFF_ID = '2010526723-NFUasgWN';
    const API_URL = 'https://script.google.com/macros/s/AKfycbzlj1-GyAD6AxwmeyWaZuTbUBGcBzvL0LgRgSCXfeSdhoOTjpRyZAiYWIA7WTtG_7AvnA/exec';

    const app = document.getElementById('app');

    let lineProfile = null;
    let currentCustomer = null;
    let currentVehicles = [];
    let currentMenus = [];
    let currentOpenSlots = [];
    let currentAllowedSlotCounts = [];
    let currentMaxSlotCount = 5;
    let currentIsAdmin = false;

    let selectedVehicleId = '';
    let selectedMenuId = '';
    let selectedSlotIds = [];
    let selectedSlotDate = '';
    let calendarYear = new Date().getFullYear();
    let calendarMonth = new Date().getMonth() + 1;
    let calendarDays = [];

    async function main() {
      try {
        app.className = 'status';
        app.innerHTML = 'LIFF SDKを確認中...';

        if (typeof liff === 'undefined') {
          throw new Error('LIFF SDKが読み込めていません。');
        }

        app.innerHTML = 'LIFFを初期化しています...';

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          app.innerHTML = 'LINEログインへ移動します...';
          liff.login();
          return;
        }

        app.innerHTML = 'LINEプロフィールを取得しています...';

        lineProfile = await liff.getProfile();

        app.innerHTML = '予約DBと同期しています...';

        const response = await jsonp(API_URL, {
          action: 'syncCustomer',
          lineUserId: lineProfile.userId,
          lineDisplayName: lineProfile.displayName
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        currentCustomer = response.customer;
        currentVehicles = response.vehicles || [];
        currentIsAdmin = !!response.isAdmin;

        if (needsInitialRegistration(currentCustomer, currentVehicles)) {
          renderInitialForm();
        } else {
          renderHome();
        }

      } catch (error) {
        renderError(error);
      }
    }

    function needsInitialRegistration(customer, vehicles) {
      if (!customer) return true;
      if (customer.status === '仮登録') return true;
      if (!customer.name) return true;
      if (!vehicles || vehicles.length === 0) return true;
      return false;
    }

    function renderInitialForm() {
      app.className = 'status warning';
      app.innerHTML = `
        <strong>初回登録</strong><br>
        初回のみ、お客様情報と車両情報を登録してください。<br>
        次回以降は入力を省略できます。

        <h2>お客様情報</h2>

        <label>氏名 必須</label>
        <input id="name" type="text" placeholder="例：山田 太郎" value="${escapeAttr(currentCustomer.name || '')}">

        <label>LINE名</label>
        <input id="lineName" type="text" placeholder="LINE上の表示名など" value="${escapeAttr(currentCustomer.line_name || lineProfile.displayName || '')}">

        <label>電話番号</label>
        <input id="phone" type="tel" placeholder="例：090-0000-0000" value="${escapeAttr(currentCustomer.phone || '')}">

        <label>メールアドレス</label>
        <input id="email" type="email" placeholder="例：example@example.com" value="${escapeAttr(currentCustomer.email || '')}">

        <h2>車両情報</h2>

        <label>メーカー</label>
        <input id="maker" type="text" placeholder="例：スズキ、ホンダ、ヤマハ">

        <label>車種 必須</label>
        <input id="model" type="text" placeholder="例：GSX-S1000、GROM、MT-09">

        <label>年式</label>
        <input id="year" type="text" placeholder="例：2020">

        <label>型式</label>
        <input id="typeCode" type="text" placeholder="例：2BL-GT79B">

        <label>車両メモ</label>
        <textarea id="vehicleNote" placeholder="改造内容、気になる症状、用途など"></textarea>

        <button onclick="saveInitialProfile()">登録する</button>
      `;
    }

    async function saveInitialProfile() {
      try {
        const name = getValue('name');
        const lineName = getValue('lineName');
        const phone = getValue('phone');
        const email = getValue('email');

        const maker = getValue('maker');
        const model = getValue('model');
        const year = getValue('year');
        const typeCode = getValue('typeCode');
        const vehicleNote = getValue('vehicleNote');

        if (!name) {
          alert('氏名を入力してください。');
          return;
        }

        if (!model) {
          alert('車種を入力してください。');
          return;
        }

        app.className = 'status';
        app.innerHTML = '登録しています...';

        const response = await jsonp(API_URL, {
          action: 'saveInitialProfile',
          lineUserId: lineProfile.userId,
          name,
          lineName,
          phone,
          email,
          maker,
          model,
          year,
          typeCode,
          vehicleNote
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        currentCustomer = response.customer;
        currentVehicles = response.vehicles || [];
        currentIsAdmin = !!response.isAdmin;

        renderHome();

      } catch (error) {
        renderError(error);
      }
    }

    function renderHome() {
      app.className = 'status';

      const vehiclesHtml = currentVehicles.length
        ? currentVehicles.map(v => `
            <div class="vehicle-card">
              <strong>${escapeHtml(v.vehicle_nickname || v.model || '登録車両')}</strong><br>
              メーカー：${escapeHtml(v.maker || '')}<br>
              車種：${escapeHtml(v.model || '')}<br>
              年式：${escapeHtml(v.year || '')}<br>
              型式：${escapeHtml(v.type_code || '')}<br>
              排気量：${escapeHtml(v.displacement || '')}<br>
              用途：${escapeHtml(v.usage || '')}<br>
              メモ：${escapeHtml(v.note || '')}<br>

              <button class="secondary" onclick="showVehicleForm('${escapeAttr(v.vehicle_id)}')">車両情報を修正する</button>
            </div>
          `).join('')
        : '<p>登録車両がありません。</p>';

      const adminHtml = currentIsAdmin
        ? `
          <div class="admin-badge">管理者</div>
          <button class="secondary" onclick="showAdminDashboard()">管理者画面</button>
        `
        : '';

      app.innerHTML = `
        <strong>登録済みです</strong><br>
        ${currentIsAdmin ? '<span class="admin-badge">管理者としてログイン中</span><br>' : ''}
        <div class="small">
          会員種別：${escapeHtml(currentCustomer.member_type || '非会員')} / 状態：${escapeHtml(currentCustomer.status)}
        </div>

        <h2>予約可能日</h2>
        <div id="homeCalendar" class="date-card">月間カレンダーを取得しています...</div>

        <button onclick="showBooking()">空き枠を見て仮予約する</button>

        <h2>登録車両</h2>
        ${vehiclesHtml}

        <button class="secondary" onclick="showVehicleForm()">車両を追加する</button>
        ${adminHtml}
        <button class="secondary" onclick="location.reload()">再読み込み</button>
      `;

      refreshHomeCalendar();
    }

    function formatMonthLabel(year, month) {
      return `${year}年${month}月`;
    }

    async function loadMonthAvailability() {
      const response = await jsonp(API_URL, {
        action: 'monthAvailability',
        lineUserId: lineProfile.userId,
        year: calendarYear,
        month: calendarMonth
      });
      if (!response.ok) throw new Error(response.message || '月間カレンダーを取得できません。');
      calendarDays = response.days || [];
      return response;
    }

    function calendarGridHtml(admin, home) {
      if (!calendarDays.length) return '<div class="date-card">この月の営業日情報はありません。</div>';
      const padding = new Date(calendarYear, calendarMonth - 1, 1).getDay();
      const blanks = Array.from({ length: padding }, () => '<div></div>').join('');
      const days = calendarDays.map(day => `
        <button class="calendar-day status-${escapeAttr(day.profile === 'premium_only' ? 'P' : day.symbol)}" ${admin ? `onclick="showAdminDay('${escapeAttr(day.date)}')"` : 'disabled'}>
          <span class="day-number">${escapeHtml(day.date.slice(-2))}</span>
          <strong class="day-symbol">${escapeHtml(day.profile === 'premium_only' ? 'P' : day.symbol)}</strong>
        </button>
      `).join('');
      return `<div class="business-calendar">${blanks}${days}</div>`;
    }

    function calendarToolbarHtml(admin, home) {
      return `
        <div class="calendar-toolbar">
          <button class="secondary" onclick="changeCalendarMonth(-1, ${admin ? 'true' : 'false'}, ${home ? 'true' : 'false'})">前月</button>
          <span class="calendar-title">${formatMonthLabel(calendarYear, calendarMonth)}</span>
          <button class="secondary" onclick="changeCalendarMonth(1, ${admin ? 'true' : 'false'}, ${home ? 'true' : 'false'})">翌月</button>
        </div>
        <div class="calendar-legend">○ 通常予約可能　P Premium専用　× 予約不可・満枠　休 休業</div>
      `;
    }

    async function changeCalendarMonth(delta, admin, home) {
      const d = new Date(calendarYear, calendarMonth - 1 + delta, 1);
      calendarYear = d.getFullYear();
      calendarMonth = d.getMonth() + 1;
      if (home) await refreshHomeCalendar();
      else if (admin) await renderAdminCalendar();
      else await showCustomerCalendar();
    }

    async function refreshHomeCalendar() {
      const calendar = document.getElementById('homeCalendar');
      if (!calendar) return;
      try {
        calendar.innerHTML = '月間カレンダーを取得しています...';
        await loadMonthAvailability();
        calendar.innerHTML = `${calendarToolbarHtml(false, true)}${calendarGridHtml(false, true)}`;
      } catch (error) {
        calendar.innerHTML = '<strong>月間カレンダーを取得できませんでした。</strong>';
        console.error(error);
      }
    }

    async function showCustomerCalendar() {
      try {
        app.className = 'status';
        app.innerHTML = '月間カレンダーを取得しています...';
        await loadMonthAvailability();
        renderCustomerCalendar();
      } catch (error) { renderError(error); }
    }

    function renderCustomerCalendar() {
      app.className = 'status';
      app.innerHTML = `
        <strong>営業日カレンダー</strong><br>
        日付を選ぶと空き状況を確認できます。火・水はPremium会員専用です。
        ${calendarToolbarHtml(false, false)}
        ${calendarGridHtml(false, false)}
        <button class="secondary" onclick="renderHome()">ホームに戻る</button>
      `;
    }

    async function showDayAvailability(date) {
      try {
        app.className = 'status';
        app.innerHTML = '日別の空き状況を取得しています...';
        const response = await jsonp(API_URL, { action: 'dayAvailability', lineUserId: lineProfile.userId, date });
        if (!response.ok) throw new Error(response.message || '日別の空き状況を取得できません。');
        const a = response.availability;
        const slots = (a.slots || []).map(s => `<div class="date-card">${escapeHtml(s.start_time)}〜${escapeHtml(s.end_time)}：${escapeHtml(s.symbol)}</div>`).join('') || '<div class="date-card">対象枠がありません。</div>';
        const canOpenBooking = a.symbol === '○';
        app.className = 'status';
        app.innerHTML = `
          <strong>${escapeHtml(a.date)} の空き状況：${escapeHtml(a.symbol)}</strong><br>
          ${a.symbol === 'P' ? 'この日はPremium会員専用です。' : ''}
          ${slots}
          ${canOpenBooking ? '<button onclick="showBooking()">予約枠を選ぶ</button>' : ''}
          <button class="secondary" onclick="renderCustomerCalendar()">カレンダーへ戻る</button>
        `;
      } catch (error) { renderError(error); }
    }

    function showVehicleForm(vehicleId) {
      const vehicle = vehicleId
        ? currentVehicles.find(v => String(v.vehicle_id) === String(vehicleId))
        : null;

      const isEdit = !!vehicle;

      app.className = 'status';
      app.innerHTML = `
        <strong>${isEdit ? '車両情報を修正' : '車両を追加'}</strong><br>
        ${isEdit ? '登録済みの車両情報を修正します。' : '2台目以降の車両を追加できます。'}

        <input id="vehicleId" type="hidden" value="${escapeAttr(vehicle ? vehicle.vehicle_id : '')}">

        <label>車両名・呼び名</label>
        <input id="vehicleNickname" type="text" placeholder="例：メイン車両、GROM、GSX-S1000" value="${escapeAttr(vehicle ? vehicle.vehicle_nickname || '' : '')}">

        <label>メーカー</label>
        <input id="vehicleMaker" type="text" placeholder="例：ホンダ、ヤマハ、スズキ" value="${escapeAttr(vehicle ? vehicle.maker || '' : '')}">

        <label>車種 必須</label>
        <input id="vehicleModel" type="text" placeholder="例：GROM、MT-09、GSX-S1000" value="${escapeAttr(vehicle ? vehicle.model || '' : '')}">

        <label>年式</label>
        <input id="vehicleYear" type="text" placeholder="例：2021" value="${escapeAttr(vehicle ? vehicle.year || '' : '')}">

        <label>型式</label>
        <input id="vehicleTypeCode" type="text" placeholder="例：JC92、2BL-GT79B" value="${escapeAttr(vehicle ? vehicle.type_code || '' : '')}">

        <label>排気量</label>
        <input id="vehicleDisplacement" type="text" placeholder="例：125、1000" value="${escapeAttr(vehicle ? vehicle.displacement || '' : '')}">

        <label>用途</label>
        <input id="vehicleUsage" type="text" placeholder="例：街乗り、ツーリング、ジムカーナ、サーキット" value="${escapeAttr(vehicle ? vehicle.usage || '' : '')}">

        <label>メモ</label>
        <textarea id="vehicleNote" placeholder="改造内容、気になる症状、今後やりたい作業など">${escapeHtml(vehicle ? vehicle.note || '' : '')}</textarea>

        <button onclick="saveVehicle()">保存する</button>
        ${isEdit ? '<button class="danger" onclick="deactivateVehicle()">この車両を非表示にする</button>' : ''}
        <button class="secondary" onclick="renderHome()">戻る</button>
      `;
    }

    async function saveVehicle() {
      try {
        const vehicleId = getValue('vehicleId');
        const vehicleNickname = getValue('vehicleNickname');
        const maker = getValue('vehicleMaker');
        const model = getValue('vehicleModel');
        const year = getValue('vehicleYear');
        const typeCode = getValue('vehicleTypeCode');
        const displacement = getValue('vehicleDisplacement');
        const usage = getValue('vehicleUsage');
        const note = getValue('vehicleNote');

        if (!model) {
          alert('車種を入力してください。');
          return;
        }

        app.className = 'status';
        app.innerHTML = '車両情報を保存しています...';

        const response = await jsonp(API_URL, {
          action: 'saveVehicle',
          lineUserId: lineProfile.userId,
          vehicleId,
          vehicleNickname,
          maker,
          model,
          year,
          typeCode,
          displacement,
          usage,
          note
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        currentVehicles = response.vehicles || [];

        app.className = 'status';
        app.innerHTML = `
          <strong>車両情報を保存しました</strong><br><br>
          ${response.mode === 'created' ? '新しい車両を追加しました。' : '車両情報を更新しました。'}

          <button onclick="renderHome()">ホームに戻る</button>
          <button class="secondary" onclick="showVehicleForm()">別の車両を追加する</button>
        `;

      } catch (error) {
        renderError(error);
      }
    }

    async function deactivateVehicle() {
      try {
        const vehicleId = getValue('vehicleId');

        if (!vehicleId) {
          alert('対象車両が見つかりません。');
          return;
        }

        if (!confirm('この車両を非表示にしますか？\n過去の予約履歴には残りますが、今後の予約画面には表示されなくなります。')) {
          return;
        }

        app.className = 'status';
        app.innerHTML = '車両を非表示にしています...';

        const response = await jsonp(API_URL, {
          action: 'deactivateVehicle',
          lineUserId: lineProfile.userId,
          vehicleId
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        currentVehicles = response.vehicles || [];

        app.className = 'status';
        app.innerHTML = `
          <strong>車両を非表示にしました</strong><br><br>
          この車両は今後の予約画面には表示されません。<br>
          過去の予約履歴には残ります。

          <button onclick="renderHome()">ホームに戻る</button>
        `;

      } catch (error) {
        renderError(error);
      }
    }

      
    async function showBooking(menuId) {
      try {
        app.className = 'status';
        app.innerHTML = '空き枠を取得しています...';

        const response = await jsonp(API_URL, {
          action: 'getBookingData',
          lineUserId: lineProfile.userId,
          menuId: menuId || selectedMenuId || ''
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        currentCustomer = response.customer;
        currentVehicles = response.vehicles || [];
        currentMenus = response.menus || [];
        currentOpenSlots = response.openSlots || [];
        currentAllowedSlotCounts = response.allowedSlotCounts || [1,2,3,4,5];
        currentMaxSlotCount = Number(response.maxSlotCount || 5);
        currentIsAdmin = !!response.isAdmin;

        selectedMenuId = response.selectedMenuId || (currentMenus[0] ? currentMenus[0].menu_id : '');
        selectedVehicleId = selectedVehicleId || (currentVehicles[0] ? currentVehicles[0].vehicle_id : '');

        selectedSlotIds = [];
        selectedSlotDate = '';

        renderBookingForm();

      } catch (error) {
        renderError(error);
      }
    }

    function renderBookingForm() {
      const vehicleOptions = currentVehicles.map(v => `
        <option value="${escapeAttr(v.vehicle_id)}" ${v.vehicle_id === selectedVehicleId ? 'selected' : ''}>
          ${escapeHtml(v.vehicle_nickname || v.model || v.vehicle_id)}
        </option>
      `).join('');

      const menuOptions = currentMenus.map(m => `
        <option value="${escapeAttr(m.menu_id)}" ${m.menu_id === selectedMenuId ? 'selected' : ''}>
          ${escapeHtml(m.menu_name)}
        </option>
      `).join('');

      const slotsHtml = renderSlotsHtml(currentOpenSlots);

      app.className = 'status';
      app.innerHTML = `
        <strong>仮予約申込</strong><br>
        空き枠を選んで仮予約してください。<br>
        作業内容確認後、eFactory側で承認して予約確定となります。

        <label>車両</label>
        <select id="vehicleId" onchange="selectedVehicleId=this.value">
          ${vehicleOptions}
        </select>

        <label>メニュー</label>
        <select id="menuId" onchange="changeMenu(this.value)">
          ${menuOptions}
        </select>

        <h2>空き枠</h2>
        <div class="small">
          1枠は90分です。1〜${escapeHtml(currentMaxSlotCount)}枠まで選択できます。<br>
          同じ日の枠だけ選択できます。選択済みの枠をもう一度押すと解除できます。
        </div>

        ${slotsHtml}

        <div id="selectedSummary" class="selected-box">
          選択中：なし
        </div>

        <label>作業内容 必須</label>
        <textarea id="workDetail" placeholder="例：ブレーキフルード交換を一緒にやりたい。持込フルードあり。"></textarea>

        <label>持込部品</label>
        <select id="partsBrought">
          <option value="なし">なし</option>
          <option value="あり">あり</option>
          <option value="未定">未定</option>
        </select>

        <label>補足・要望</label>
        <textarea id="customerMessage" placeholder="不安な点、事前に伝えたいことがあれば入力してください。"></textarea>

        <button onclick="submitReservation()">仮予約する</button>
        <button class="secondary" onclick="renderHome()">戻る</button>
      `;

      updateSelectedSummary();
    }

    function renderSlotsHtml(slots) {
      if (!slots || slots.length === 0) {
        return `
          <div class="date-card">
            現在、選択可能な空き枠がありません。
          </div>
        `;
      }

      const groups = {};
      slots.forEach(s => {
        const key = `${s.date}（${s.weekday_jp}）`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(s);
      });

      return Object.keys(groups).map(dateLabel => {
        const buttons = groups[dateLabel].map(s => `
          <button class="slot" id="slot-${escapeAttr(s.slot_id)}" onclick="toggleSlot('${escapeAttr(s.slot_id)}')">
            ${escapeHtml(s.start_time)}〜${escapeHtml(s.end_time)}
          </button>
        `).join('');

        return `
          <div class="date-card">
            <strong>${escapeHtml(dateLabel)}</strong>
            ${buttons}
          </div>
        `;
      }).join('');
    }

    function toggleSlot(slotId) {
      const slot = currentOpenSlots.find(s => s.slot_id === slotId);
      if (!slot) return;

      const alreadySelected = selectedSlotIds.includes(slotId);

      if (alreadySelected) {
        selectedSlotIds = selectedSlotIds.filter(id => id !== slotId);

        if (selectedSlotIds.length === 0) {
          selectedSlotDate = '';
        }

        updateSelectedSummary();
        return;
      }

      if (selectedSlotIds.length >= currentMaxSlotCount) {
        alert(`${currentMaxSlotCount}枠まで選択できます。`);
        return;
      }

      if (selectedSlotDate && selectedSlotDate !== slot.date) {
        alert('複数日にまたがる予約はできません。同じ日の枠を選択してください。');
        return;
      }

      selectedSlotDate = slot.date;
      selectedSlotIds.push(slotId);

      selectedSlotIds.sort((a, b) => {
        const sa = currentOpenSlots.find(s => s.slot_id === a);
        const sb = currentOpenSlots.find(s => s.slot_id === b);
        const ka = `${sa.date} ${sa.start_time}`;
        const kb = `${sb.date} ${sb.start_time}`;
        return ka.localeCompare(kb);
      });

      updateSelectedSummary();
    }

    function updateSelectedSummary() {
      document.querySelectorAll('button.slot').forEach(btn => {
        btn.classList.remove('selected');
      });

      selectedSlotIds.forEach(id => {
        const btn = document.getElementById('slot-' + id);
        if (btn) btn.classList.add('selected');
      });

      const box = document.getElementById('selectedSummary');
      if (!box) return;

      if (selectedSlotIds.length === 0) {
        box.innerHTML = '選択中：なし';
        return;
      }

      const selectedSlots = selectedSlotIds
        .map(id => currentOpenSlots.find(s => s.slot_id === id))
        .filter(Boolean)
        .sort((a, b) => `${a.date} ${a.start_time}`.localeCompare(`${b.date} ${b.start_time}`));

      const dateLabel = selectedSlots.length
        ? `${selectedSlots[0].date}（${selectedSlots[0].weekday_jp}）`
        : '';

      const slotLabels = selectedSlots
        .map(s => `${s.start_time}〜${s.end_time}`)
        .join('<br>');

      const totalMin = selectedSlots.length * 90;

      box.innerHTML = `
        <strong>選択中</strong><br>
        日付：${escapeHtml(dateLabel)}<br>
        ${slotLabels}<br>
        合計：${selectedSlots.length}枠 / ${totalMin}分
      `;
    }

    function changeMenu(menuId) {
      selectedMenuId = menuId;
      showBooking(menuId);
    }

    async function submitReservation() {
      try {
        const vehicleId = document.getElementById('vehicleId').value;
        const menuId = document.getElementById('menuId').value;
        const workDetail = getValue('workDetail');
        const partsBrought = getValue('partsBrought');
        const customerMessage = getValue('customerMessage');

        if (!selectedSlotIds || selectedSlotIds.length === 0) {
          alert('空き枠を1つ以上選択してください。');
          return;
        }

        if (selectedSlotIds.length > currentMaxSlotCount) {
          alert(`${currentMaxSlotCount}枠まで選択できます。`);
          return;
        }

        if (!workDetail) {
          alert('作業内容を入力してください。');
          return;
        }

        app.className = 'status';
        app.innerHTML = '仮予約を登録しています...';

        const response = await jsonp(API_URL, {
          action: 'createReservation',
          lineUserId: lineProfile.userId,
          vehicleId,
          menuId,
          slotIds: selectedSlotIds.join(','),
          workDetail,
          partsBrought,
          customerMessage
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        const r = response.reservation;

        app.className = 'status';
        app.innerHTML = `
          <strong>仮予約を受け付けました</strong><br><br>
          予約ID：${escapeHtml(r.reservation_id)}<br>
          日時：${escapeHtml(r.date)} ${escapeHtml(r.start_time)}〜${escapeHtml(r.end_time)}<br>
          選択枠：${escapeHtml(r.selected_slots_label || '')}<br>
          利用枠数：${escapeHtml(r.slot_count)}枠（${escapeHtml(r.duration_min)}分）<br>
          状態：${escapeHtml(r.status)}<br><br>
          この時点ではまだ予約確定ではありません。<br>
          作業内容・車両状態・持込部品を確認後、eFactory側で承認して予約確定となります。<br><br>
          LINEにも仮予約申請中のメッセージを送信しました。

          <button onclick="showBooking()">別の仮予約をする</button>
          <button class="secondary" onclick="renderHome()">ホームに戻る</button>
        `;

      } catch (error) {
        renderError(error);
      }
    }

    async function showAdminDashboard() {
      if (!currentIsAdmin) {
        renderError(new Error('管理者権限がありません。'));
        return;
      }

      try {
        app.className = 'status';
        app.innerHTML = '管理者情報を取得しています...';

        const response = await jsonp(API_URL, {
          action: 'getAdminDashboard',
          lineUserId: lineProfile.userId
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        renderAdminDashboard(response.pending || [], response.activeReservations || []);
        
      } catch (error) {
        renderError(error);
      }
    }

    function renderAdminDashboard(pending, activeReservations) {
      app.className = 'status';

      const pendingHtml = pending.length
        ? pending.map(r => `
            <div class="date-card">
              <strong>${escapeHtml(r.date)}（${escapeHtml(r.weekday_jp)}） ${escapeHtml(r.start_time)}〜${escapeHtml(r.end_time)}</strong><br>
              選択枠：${escapeHtml(r.selected_slots_label || '')}<br>
              予約ID：${escapeHtml(r.reservation_id)}<br>
              お客様：${escapeHtml(r.customer_name)} 様<br>
              会員種別：${escapeHtml(r.member_type)}<br>
              車両：${escapeHtml(r.vehicle_name)}<br>
              メニュー：${escapeHtml(r.menu_name)}<br>
              利用枠数：${escapeHtml(r.slot_count)}枠（${escapeHtml(r.duration_min)}分）<br>
              確定ルール：${escapeHtml(formatPolicy(r.confirmation_policy))}<br>
              作業内容：${escapeHtml(r.work_detail)}<br>
              持込部品：${escapeHtml(r.parts_brought)}<br>
              補足：${escapeHtml(r.customer_message)}<br>

              <button onclick="approveReservation('${escapeAttr(r.reservation_id)}', 'close')">承認してこの枠を締め切る</button>
              <button class="secondary" onclick="approveReservation('${escapeAttr(r.reservation_id)}', 'keep_open')">承認して追加受付可能にする</button>
              <button class="danger" onclick="rejectReservation('${escapeAttr(r.reservation_id)}')">却下して枠を戻す</button>
            </div>
          `).join('')
        : '<div class="date-card">承認待ちの仮予約はありません。</div>';

      const activeHtml = activeReservations && activeReservations.length
        ? activeReservations.map(r => `
            <div class="date-card">
              <strong>${escapeHtml(r.date)}（${escapeHtml(r.weekday_jp)}） ${escapeHtml(r.start_time)}〜${escapeHtml(r.end_time)}</strong><br>
              選択枠：${escapeHtml(r.selected_slots_label || '')}<br>
              予約ID：${escapeHtml(r.reservation_id)}<br>
              状態：${escapeHtml(r.status)}<br>
              お客様：${escapeHtml(r.customer_name)} 様<br>
              会員種別：${escapeHtml(r.member_type)}<br>
              車両：${escapeHtml(r.vehicle_name)}<br>
              メニュー：${escapeHtml(r.menu_name)}<br>
              利用枠数：${escapeHtml(r.slot_count)}枠（${escapeHtml(r.duration_min)}分）<br>
              作業内容：${escapeHtml(r.work_detail)}<br>
              持込部品：${escapeHtml(r.parts_brought)}<br>
              補足：${escapeHtml(r.customer_message)}<br>

              <button class="danger" onclick="cancelReservation('${escapeAttr(r.reservation_id)}', 'release')">キャンセルして枠を開放する</button>
              <button class="secondary" onclick="cancelReservation('${escapeAttr(r.reservation_id)}', 'keep_blocked')">キャンセルするが枠は閉めたままにする</button>
            </div>
          `).join('')
        : '<div class="date-card">現在有効な予約はありません。</div>';

      app.innerHTML = `
        <strong>管理者画面</strong><br>
        承認待ちの確認と、予約キャンセル処理ができます。

        <h2>承認待ち</h2>
        ${pendingHtml}

        <h2>予約管理</h2>
        <div class="small">
          お客様から公式LINEでキャンセル依頼があった場合、内容確認後にここからキャンセル処理してください。<br>
          スプレッドシートを直接編集せず、この画面から操作する運用を推奨します。
        </div>
        ${activeHtml}

        <h2>営業日カレンダー</h2>
        <div class="small">通常営業、完全休業、Premium専用、時間変更を設定できます。休業へ変更しても既存予約はキャンセルされません。</div>
        <button class="secondary" onclick="showAdminCalendar()">営業日設定を開く</button>
        <button class="secondary" onclick="renderHome()">ホームに戻る</button>
      `;
    }

    async function showAdminCalendar() {
      try {
        app.className = 'status';
        app.innerHTML = '営業日カレンダーを取得しています...';
        await loadMonthAvailability();
        renderAdminCalendar();
      } catch (error) { renderError(error); }
    }

    function renderAdminCalendar() {
      app.className = 'status';
      app.innerHTML = `
        <strong>管理者：営業日設定</strong><br>
        日付を選んで営業日ルールを設定します。既存予約・Google Calendar・LINE通知は変更しません。
        ${calendarToolbarHtml(true)}
        ${calendarGridHtml(true)}
        <button class="secondary" onclick="showAdminDashboard()">管理者画面に戻る</button>
      `;
    }

    async function showAdminDay(date) {
      try {
        app.className = 'status';
        app.innerHTML = '日別設定を取得しています...';
        const response = await jsonp(API_URL, { action: 'dayAvailability', lineUserId: lineProfile.userId, date });
        if (!response.ok) throw new Error(response.message || '日別設定を取得できません。');
        const a = response.availability;
        app.className = 'status';
        app.innerHTML = `
          <strong>${escapeHtml(date)} の営業日設定</strong><br>
          現在：${escapeHtml(a.profile)} / ${escapeHtml(a.symbol)}　既存予約：${escapeHtml(a.active_reservations || 0)}件
          <label>営業日ルール</label>
          <select id="overrideStatus">
            <option value="open">通常営業</option>
            <option value="closed">完全休業</option>
            <option value="premium_only">Premium専用</option>
            <option value="custom">時間変更</option>
            <option value="clear">通常ルールへ戻す</option>
          </select>
          <label>custom時間（時間変更時のみ、例：09:00-10:30,13:00-14:30）</label>
          <input id="overrideTimes" type="text" placeholder="09:00-10:30,13:00-14:30">
          <div class="warning">完全休業にしても、既存予約は自動キャンセルされず、Google CalendarとLINE通知も変更しません。</div>
          <button onclick="saveScheduleOverride('${escapeAttr(date)}')">保存する</button>
          <button class="secondary" onclick="renderAdminCalendar()">カレンダーへ戻る</button>
        `;
      } catch (error) { renderError(error); }
    }

    async function saveScheduleOverride(date) {
      try {
        const status = getValue('overrideStatus');
        const profile = getValue('overrideTimes');
        if (status === 'custom' && !profile) { alert('時間変更には時間を入力してください。'); return; }
        if (!confirm(`${date} を「${status}」に設定します。既存予約は変更しません。保存しますか？`)) return;
        app.className = 'status';
        app.innerHTML = '営業日設定を保存しています...';
        const response = await jsonp(API_URL, {
          action: 'saveScheduleOverride', lineUserId: lineProfile.userId, date, status, profile
        });
        if (!response.ok) throw new Error(response.message || '営業日設定を保存できません。');
        await loadMonthAvailability();
        renderAdminCalendar();
      } catch (error) { renderError(error); }
    }
    async function approveReservation(reservationId, slotHandling) {
      const label = slotHandling === 'keep_open'
        ? 'この予約を承認し、この時間帯を追加受付可能にしますか？'
        : 'この予約を承認し、この時間帯を締め切りますか？';

      if (!confirm(label)) {
        return;
      }

      try {
        app.className = 'status';
        app.innerHTML = '承認処理中です...';

        const response = await jsonp(API_URL, {
          action: 'approveReservation',
          lineUserId: lineProfile.userId,
          reservationId,
          slotHandling
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        const slotHandlingLabel = response.slot_handling === 'keep_open'
          ? '追加受付可能'
          : '締め切り';

        app.className = 'status';
        app.innerHTML = `
          <strong>承認しました</strong><br><br>
          予約ID：${escapeHtml(response.reservation_id)}<br>
          状態：${escapeHtml(response.status)}<br>
          枠の扱い：${escapeHtml(slotHandlingLabel)}<br>
          選択枠：${escapeHtml(response.selected_slots_label || '')}<br>
          Googleカレンダー登録：完了<br>
          開始：${escapeHtml(response.start)}<br>
          終了：${escapeHtml(response.end)}<br><br>
          ${response.status === '確定'
            ? 'プレミアム会員のため、予約確定LINE通知を送信しました。'
            : '6日前確定対象のため、承認時点ではLINE通知は送信していません。'
          }

          <button onclick="showAdminDashboard()">承認待ち一覧に戻る</button>
          <button class="secondary" onclick="renderHome()">ホームに戻る</button>
        `;

      } catch (error) {
        renderError(error);
      }
    }

    async function rejectReservation(reservationId) {
      const reason = prompt('却下理由やメモを入力してください。空欄でも可。', '');

      if (reason === null) {
        return;
      }

      try {
        app.className = 'status';
        app.innerHTML = '却下処理中です...';

        const response = await jsonp(API_URL, {
          action: 'rejectReservation',
          lineUserId: lineProfile.userId,
          reservationId,
          reason
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        app.className = 'status';
        app.innerHTML = `
          <strong>却下しました</strong><br><br>
          予約ID：${escapeHtml(response.reservation_id)}<br>
          状態：${escapeHtml(response.status)}<br>
          該当枠は空き枠に戻しました。<br>
          お客様にLINEで却下通知を送信しました。<br><br>

          <button onclick="showAdminDashboard()">承認待ち一覧に戻る</button>
          <button class="secondary" onclick="renderHome()">ホームに戻る</button>
        `;

      } catch (error) {
        renderError(error);
      }
    }

    async function cancelReservation(reservationId, cancelSlotHandling) {
      const handlingLabel = cancelSlotHandling === 'keep_blocked'
        ? 'キャンセルしますが、この時間帯は予約不可のままにします。'
        : 'キャンセルして、この時間帯を空き枠に戻します。';

      const reason = prompt(
        `${handlingLabel}\n\nキャンセル理由・メモを入力してください。`,
        ''
      );

      if (reason === null) {
        return;
      }

      const confirmMessage = cancelSlotHandling === 'keep_blocked'
        ? 'この予約をキャンセルし、枠は閉めたままにしますか？'
        : 'この予約をキャンセルし、枠を開放しますか？';

      if (!confirm(confirmMessage)) {
        return;
      }

      try {
        app.className = 'status';
        app.innerHTML = 'キャンセル処理中です...';

        const response = await jsonp(API_URL, {
          action: 'cancelReservation',
          lineUserId: lineProfile.userId,
          reservationId,
          cancelSlotHandling,
          reason
        });

        if (!response.ok) {
          throw new Error(JSON.stringify(response, null, 2));
        }

        const slotHandlingLabel = response.cancel_slot_handling === 'keep_blocked'
          ? '枠は閉めたまま'
          : '枠を開放';

        app.className = 'status';
        app.innerHTML = `
          <strong>キャンセル処理が完了しました</strong><br><br>
          予約ID：${escapeHtml(response.reservation_id)}<br>
          状態：${escapeHtml(response.status)}<br>
          枠の扱い：${escapeHtml(slotHandlingLabel)}<br>
          Googleカレンダー：${response.calendarDeleteResult && response.calendarDeleteResult.ok ? '削除済みまたは対象なし' : '削除失敗'}<br>
          お客様へのLINE通知：${response.lineNotification && response.lineNotification.ok ? '送信済み' : '送信失敗'}<br><br>

          <button onclick="showAdminDashboard()">管理者画面に戻る</button>
          <button class="secondary" onclick="renderHome()">ホームに戻る</button>
        `;

      } catch (error) {
        renderError(error);
      }
    }

    
    function formatPolicy(policy) {
      if (policy === 'immediate') return '承認後すぐ確定';
      if (policy === 'six_days') return '6日前確定';
      return policy || '';
    }

    function getValue(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function jsonp(url, params) {
      return new Promise((resolve, reject) => {
        const callbackName =
          'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

        params.callback = callbackName;

        const query = Object.keys(params)
          .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
          .join('&');

        const script = document.createElement('script');
        script.src = url + '?' + query;

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('Apps Script APIの呼び出しに失敗しました。'));
        };

        function cleanup() {
          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        setTimeout(() => {
          cleanup();
          reject(new Error('Apps Script APIの応答がタイムアウトしました。'));
        }, 60000);

        document.body.appendChild(script);
      });
    }

    function renderError(error) {
      app.className = 'status error';
      app.innerHTML = `
        <strong>エラー</strong>
        <pre>${escapeHtml(String(error))}
URL: ${escapeHtml(location.href)}
UA: ${escapeHtml(navigator.userAgent)}</pre>
        <button onclick="location.reload()">再読み込み</button>
      `;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(str) {
      return escapeHtml(str).replaceAll('`', '&#096;');
    }

    main();
  </script>
